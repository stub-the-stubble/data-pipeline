name: Validate, ingest and publish IARI data

on:
  schedule:
    - cron: '35 0-23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate only, ingest the latest completed IARI bulletin, or deploy committed data'
        type: choice
        options: [validate, ingest-and-deploy, deploy-existing]
        default: validate
        required: true

permissions:
  contents: read

# Shared by every supported writer/publisher. Hold the whole run, including deployment.
# Retain the existing group name so a transition cannot overlap an older run.
concurrency:
  group: nrsc-data-release
  cancel-in-progress: false

jobs:
  prepare:
    # Manual publication can run while the hourly writer remains held off.
    if: github.event_name == 'workflow_dispatch' || (vars.STUB_SCHEDULE_ENABLED == 'true' && vars.STUB_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      data_sha: ${{ steps.snapshot.outputs.data_sha }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve mode and enforce release gate
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
          ENABLED: ${{ vars.STUB_PUBLISH_ENABLED }}
          SCHEDULE_ENABLED: ${{ vars.STUB_SCHEDULE_ENABLED }}
        run: |
          mode="${MODE:-validate}"
          if [ "$EVENT" = schedule ]; then
            if [ "$SCHEDULE_ENABLED" != true ]; then
              echo 'Scheduled ingestion is held: STUB_SCHEDULE_ENABLED is not true'
              exit 1
            fi
            mode=ingest-and-deploy
          fi
          case "$mode" in validate|ingest-and-deploy|deploy-existing) ;; *) exit 1 ;; esac
          publish=false
          if [ "$mode" != validate ]; then
            if [ "$REF" != refs/heads/main ] || [ "$ENABLED" != true ]; then
              echo 'Publishing requires main and STUB_PUBLISH_ENABLED=true'
              exit 1
            fi
            publish=true
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: latest
          environment-file: spec-file.txt
          activate-environment: env
          auto-activate: false
      - name: Run offline tests
        run: |
          python -m pip install -r requirements-iari.txt
          python -m unittest discover -s tests -v
      - name: Require both published histories
        run: python -c "import sys; sys.path.insert(0, 'v2'); from backfill import require_histories; require_histories('docs/v2')"
      - name: Require a clean release checkout
        if: steps.mode.outputs.publish == 'true'
        run: test -z "$(git status --porcelain)"
      - name: Prepare and apply the validated IARI update
        id: ingest
        if: steps.mode.outputs.mode == 'ingest-and-deploy'
        run: |
          python v2/iari_schedule.py --baseline docs/v2 --work-dir "$RUNNER_TEMP/iari-run" --apply
          python -c "import json, os; from pathlib import Path; r=json.loads((Path(os.environ['RUNNER_TEMP'])/'iari-run/release.json').read_text()); print('changed='+str(r['status']=='ready').lower())" >> "$GITHUB_OUTPUT"
      - name: Reconcile all recovered daily files with history
        run: python -c "import sys; sys.path.insert(0, 'v2'); from backfill import validate_published_data; print('Validated daily files:', validate_published_data('docs/v2'))"
      - name: Require the reviewed IARI source migration before publication
        if: steps.mode.outputs.publish == 'true'
        run: python -c "import sys; sys.path.insert(0, 'v2'); from iari_schedule import require_iari_baseline, read_json, POLICY; print('Validated IARI season through:', require_iari_baseline('docs/v2', read_json(POLICY)))"
      - name: Commit validated JSON only
        if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- docs/v2/PB/*.json docs/v2/HR/*.json
          if ! git diff --cached --quiet; then
            # Only public state JSON is eligible; code, evidence and credentials cannot enter this commit.
            python -c "import re, subprocess; names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines(); assert names and all(re.fullmatch(r'docs/v2/(PB|HR)/(historical_data|[0-9]{4}-[0-9]{2}-[0-9]{2})[.]json', n) for n in names)"
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            git commit -m "Update validated IARI observations"
            git push origin HEAD:main
          fi
      - name: Decide whether a new snapshot needs deployment
        id: release
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CHANGED: ${{ steps.ingest.outputs.changed }}
        run: |
          publish=false
          if [ "$MODE" = deploy-existing ] || { [ "$MODE" = ingest-and-deploy ] && [ "$CHANGED" = true ]; }; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Package the committed snapshot
        if: steps.release.outputs.publish == 'true'
        id: snapshot
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Main moved; refusing to deploy a stale snapshot'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pages-site"
          git archive HEAD docs | tar -x -C "$RUNNER_TEMP/pages-site"
          echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload committed Pages artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site/docs
      - name: Retain IARI evidence and validation report
        if: always() && steps.mode.outputs.mode == 'ingest-and-deploy'
        uses: actions/upload-artifact@v4
        with:
          name: iari-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iari-run
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check the deployment snapshot is still current
        env:
          DATA_SHA: ${{ needs.prepare.outputs.data_sha }}
        run: test "$(git rev-parse HEAD)" = "$DATA_SHA"
      - uses: actions/configure-pages@v5
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
