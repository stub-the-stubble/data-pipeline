name: Validate pipeline without publishing
on:
  push:
    branches: [fix/recovery-20261116]
  pull_request:
# This workflow deliberately has no write permission, ingestion or deploy step.
# It proves the production Linux/Conda environment before release is enabled.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: latest
          environment-file: spec-file.txt
          activate-environment: env
          auto-activate: false
      - run: python -m unittest discover -s tests -v
      - name: Validate published baseline
        run: python -c "import sys; sys.path.insert(0, 'v2'); from backfill import validate_published_data; print('Validated daily files:', validate_published_data('docs/v2'))"
